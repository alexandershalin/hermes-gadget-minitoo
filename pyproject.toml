[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-minitoo-gadget"
version = "0.2.3"
description = "Hermes Gadget client for the Divoom MiniToo (iteration 1: Linux)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hermes-gadget @ git+https://github.com/Adolanium/hermes-gadget-sdk.git@81f05a1006c6df726bf8433d30fd91ea4993fd5c",  # v0.4.1
  "sounddevice>=0.4.6,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
hermes-gadget-minitoo = "hermes_minitoo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Hardware-verified transport is intentionally left byte-for-byte as shipped.
"src/hermes_minitoo/platforms/linux/transport.py" = ["UP041"]
# Server helper scripts from main, kept byte-identical until they are reworked.
"scripts/*.py" = ["E401", "E501", "E702", "I001"]
# Standalone Hermes-side helpers (stdlib only, run as plain scripts).
"hermes-side/*.py" = ["E401", "E501", "E702", "I001", "UP031"]
